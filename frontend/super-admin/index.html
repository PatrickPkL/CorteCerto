<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Super Admin · Corte Certo</title>
<script src="../shared/js/tema-inicio.js"></script>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c0c0c;
    color: #f0f0f0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    min-height: 100vh;
  }

  /* sidebar */
  .sa-sidebar {
    width: 220px;
    background: #161616;
    border-right: 1px solid #222;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 10;
  }
  .sa-sidebar-brand {
    font-size: 1.15rem;
    font-weight: 700;
    padding: 0 20px 20px;
    border-bottom: 1px solid #222;
    margin-bottom: 8px;
  }
  .sa-sidebar-brand span { color: #b8863b; }
  .sa-sidebar-nav { flex: 1; padding: 8px 0; }
  .sa-sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    color: #888;
    text-decoration: none;
    font-size: .9rem;
    transition: color .2s, background .2s;
  }
  .sa-sidebar-nav a:hover,
  .sa-sidebar-nav a.active {
    color: #f0f0f0;
    background: rgba(184,134,59,.1);
  }
  .sa-sidebar-nav a.active { border-right: 3px solid #b8863b; }
  .sa-sidebar-footer {
    padding: 12px 20px;
    border-top: 1px solid #222;
  }
  .sa-sidebar-footer a {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #888;
    text-decoration: none;
    font-size: .85rem;
    padding: 8px 0;
    transition: color .2s;
  }
  .sa-sidebar-footer a:hover { color: #e74c3c; }

  /* main */
  .sa-main {
    margin-left: 220px;
    flex: 1;
    padding: 32px;
    min-height: 100vh;
  }
  .sa-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .sa-header h1 {
    font-size: 1.4rem;
    font-weight: 600;
  }

  /* stats */
  .sa-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .sa-stat-card {
    background: #161616;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 20px;
  }
  .sa-stat-card .sa-stat-label {
    color: #888;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .sa-stat-card .sa-stat-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: #b8863b;
  }

  /* busca */
  .sa-busca {
    margin-bottom: 16px;
  }
  .sa-busca input {
    width: 100%;
    max-width: 400px;
    padding: 10px 14px;
    background: #161616;
    border: 1px solid #222;
    border-radius: 8px;
    color: #f0f0f0;
    font-size: .9rem;
    font-family: system-ui, -apple-system, sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  .sa-busca input:focus { border-color: #b8863b; }
  .sa-busca input::placeholder { color: #555; }

  /* tabela */
  .sa-table-wrap {
    background: #161616;
    border: 1px solid #222;
    border-radius: 10px;
    overflow-x: auto;
  }
  .sa-table {
    width: 100%;
    border-collapse: collapse;
  }
  .sa-table th {
    text-align: left;
    padding: 14px 16px;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #888;
    border-bottom: 1px solid #222;
  }
  .sa-table td {
    padding: 12px 16px;
    font-size: .9rem;
    border-bottom: 1px solid #1a1a1a;
  }
  .sa-table tbody tr:hover { background: rgba(184,134,59,.05); }

  /* badges */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: .78rem;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-free { background: #2a2a2a; color: #888; }
  .badge-basic { background: rgba(184,134,59,.15); color: #b8863b; }
  .badge-pro { background: rgba(46,204,113,.15); color: #2ecc71; }
  .badge-enterprise { background: rgba(155,89,182,.15); color: #9b59b6; }
  .badge-active { background: rgba(46,204,113,.15); color: #2ecc71; }
  .badge-inactive { background: rgba(231,76,60,.15); color: #e74c3c; }

  /* responsive */
  @media (max-width: 768px) {
    .sa-sidebar { width: 60px; }
    .sa-sidebar-brand,
    .sa-sidebar-nav a span,
    .sa-sidebar-footer a span { display: none; }
    .sa-sidebar-nav a { justify-content: center; padding: 12px 0; }
    .sa-main { margin-left: 60px; padding: 20px 16px; }
    .sa-stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<aside class="sa-sidebar">
  <div class="sa-sidebar-brand">Corte<span>Certo</span></div>
  <nav class="sa-sidebar-nav">
    <a href="index.html" class="active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="#lojas-section">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Lojas</span>
    </a>
  </nav>
  <div class="sa-sidebar-footer">
    <a href="#" id="btn-sair">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Sair</span>
    </a>
  </div>
</aside>

<main class="sa-main">
  <div class="sa-header">
    <h1>Dashboard</h1>
  </div>

  <div class="sa-stats-grid">
    <div class="sa-stat-card">
      <div class="sa-stat-label">Total Lojas</div>
      <div class="sa-stat-value" id="stat-lojas">—</div>
    </div>
    <div class="sa-stat-card">
      <div class="sa-stat-label">Total Usuários</div>
      <div class="sa-stat-value" id="stat-users">—</div>
    </div>
    <div class="sa-stat-card">
      <div class="sa-stat-label">Agendamentos Hoje</div>
      <div class="sa-stat-value" id="stat-agendamentos">—</div>
    </div>
    <div class="sa-stat-card">
      <div class="sa-stat-label">Receita Total</div>
      <div class="sa-stat-value" id="stat-receita">—</div>
    </div>
  </div>

  <div id="lojas-section">
    <h2 style="font-size:1.1rem; margin-bottom:16px;">Lojas</h2>
    <div class="sa-busca">
      <input type="text" id="input-busca" placeholder="Buscar por nome, cidade ou owner...">
    </div>
    <div class="sa-table-wrap">
      <table class="sa-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Cidade</th>
            <th>Owner</th>
            <th>Plano</th>
          </tr>
        </thead>
        <tbody id="tbody-lojas">
          <tr>
            <td colspan="5" style="text-align:center; color:#888; padding:32px 0;">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="../shared/js/shared.js"></script>
<script src="js/super-auth.js"></script>
<script src="js/super-admin.js"></script>

</body>
</html>
