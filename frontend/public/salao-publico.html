<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia · Corte Certo</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('cc_tema') || 'dark';</script>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="css/public.css">
</head>
<body data-page="salao">
<div class="stripe"></div>

<header class="public-header">
  <div class="brand">Corte<span>Certo</span></div>
  <nav class="public-nav">
    <a href="catalogo.html">← Voltar ao catálogo</a>
    <span id="nav-auth" class="nav-auth-slot"></span>
  </nav>
</header>

<main class="public-main">
  <a href="catalogo.html" class="btn-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar ao catálogo
  </a>
  <h3 class="section-title">Galeria</h3>
  <div class="gallery-carousel">
    <button class="gallery-arrow gallery-prev" id="gallery-prev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="gallery-viewport" id="gallery-viewport">
      <div class="gallery-track" id="gallery-track"></div>
    </div>
    <button class="gallery-arrow gallery-next" id="gallery-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="gallery-counter" id="gallery-counter">1 / 1</div>
  </div>

  <div class="salon-header-info">
    <div>
      <h1 id="salao-nome">Carregando…</h1>
      <p id="salao-meta" style="color:var(--text-muted); margin-top:6px;"></p>
      <div class="tag-list" id="salao-tags" style="margin-top:12px;"></div>
    </div>
    <div class="card" style="min-width:220px;">
      <span class="stat-label">Funcionamento</span>
      <div id="salao-funcionamento" style="font-size:14.5px; margin-top:4px;"></div>
    </div>
  </div>

  <button onclick="compartilhar()" class="btn btn-outline" style="margin-top:8px;">📤 Compartilhar</button>
  <script>
  function compartilhar() {
    var url = window.location.href;
    var nome = document.querySelector('.salon-name, h1, .salao-nome');
    var texto = 'Confira ' + (nome ? nome.textContent : 'esta barbearia') + ' no Corte Certo: ';
    if (navigator.share) {
      navigator.share({ title: 'Corte Certo', text: texto, url: url });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(texto + url).then(function() { alert('Link copiado!'); });
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(texto + url), '_blank');
    }
  }
  </script>

  <h3 class="section-title">Escolha o profissional</h3>

  <div class="prof-list-public" id="lista-profissionais-publica"></div>

  <h3 class="section-title">Escolha um serviço</h3>

  <div class="service-list-public" id="lista-servicos-publica"></div>

  <h3 class="section-title">Avaliações</h3>
  <p id="reviews-resumo" style="color:var(--text-muted); font-size:14px; margin:-6px 0 14px;"></p>
  <div class="reviews-list" id="lista-reviews"></div>

  <div id="modal-agendar-cliente" class="modal-overlay" style="display:none;">
    <div class="card" style="width:480px; max-height:90vh; overflow-y:auto;">
      <h3 class="section-title">Confirmar agendamento</h3>
      <form id="form-agendar-cliente">
        <div class="field">
          <label>Serviço</label>
          <div id="ag-resumo" hidden style="font-size:14px;"></div>
        </div>
        <div class="field" id="field-datas" style="display:none;">
          <label>Escolha a data</label>
          <div class="slot-dates" id="slot-dates"></div>
        </div>
        <div class="field" id="field-horarios" style="display:none;">
          <label>Horários disponíveis</label>
          <div class="slot-times" id="slot-times"></div>
          <p id="prof-info" style="color:var(--brass); font-size:13.5px; margin-top:8px;"></p>
        </div>
        <div class="field" id="field-dados" style="display:none;">
          <label for="ac-nome">Seu nome</label>
          <input type="text" id="ac-nome" name="nome" required>
        </div>
        <div class="field" id="field-telefone" style="display:none;">
          <label for="ac-telefone">Telefone</label>
          <input type="tel" id="ac-telefone" name="telefone" placeholder="(00) 00000-0000" required>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
          <button type="button" class="btn btn-outline" id="btn-fechar-modal-agendar">Cancelar</button>
          <button type="submit" class="btn btn-brass" id="btn-confirmar-agendamento" disabled>Confirmar agendamento</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="../shared/js/db.js"></script>
<script src="../shared/js/api.js"></script>
<script src="../shared/js/shared.js"></script>
<script src="js/salao-publico.js"></script>
</body>
</html>
